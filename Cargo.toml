[package]
name = "degenerate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
polymarket-hft = { path = "./crates/polymarket-hft"}
kalshi-rs= {path = "./crates/kalshi-rs"}
rand = "0.9.2"
tokio = "1.48.0"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
http="1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = "0.7.18"
tracing-subscriber = "0.3.22"
dotenvy = "0.15.7"
bytes = "1.11.0"
chrono = "0.4.43"
qdrant-client = "1.16.0"
candle-core = "0.9.2"
uuid = { version = "1.0", features = ["v5", "serde"] }
rustls = { version = "0.23.36", features = ["aws_lc_rs"] }
tonic = {version = "0.14.4", features = ["transport"]}
tonic-prost = "0.14.4"
prost = "0.14.3"
tokio-stream = {version = "0.1.18", features = ["sync"]}
strum = "0.28.0"
strum_macros = "0.28.0"
once_cell = "1.21.4"
rust_decimal = "1.41.0"
polymarket-client-sdk = { version = "0.4.4", default-features = false, features = ["clob"] }
alloy-primitives = "1.5.7"
alloy-signer-wallet = "0.0.0-reserved"
alloy = "1.8.3"
alloy-signer = "1.0"
alloy-signer-local = "1.0"



[build-dependencies]
tonic-prost-build = "0.14.4"


[target.'cfg(target_os = "macos")'.dependencies]
sentence-transformers-rs = { path = "./crates/sentence-transformers-rs", features = ["metal"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
sentence-transformers-rs = { path = "./crates/sentence-transformers-rs" }

[dev-dependencies]
url = "2.5.8"

