[package]
name = "degenerate"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.2.1", features = ["full"] }
anyhow = "1.0.100"
polymarket-hft = { path = "./crates/polymarket-hft"}
kalshi-rs= {path = "./crates/kalshi-rs"}
rand = "0.9.2"
tokio = "1.48.0"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
http="1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = "0.7.18"
tracing-subscriber = "0.3.22"
dotenvy = "0.15.7"
bytes = "1.11.0"

