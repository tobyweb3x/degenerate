syntax = "proto3";

package similarityhit;
option go_package = "web/protos;";

message QdrantPayload {
    string uuid = 1;
    string question = 2;
    string outcome = 3;
    string clob_token_ids = 4;
    string rules = 5;
    string market_id = 6;
    string market_category = 7;
    string market_subcategory = 8;
    string platform = 9;
    string end_date = 10;
    int64 inserted_at = 11; 
}

message Matches {
    float scored = 1;
    QdrantPayload match = 2;
}

message SimilarityHit {
    QdrantPayload anchor = 1;
    repeated Matches matches = 2;
}

message Ebo {
    string correlation_id = 1;
    int64 arb_found_at = 2;

    oneof action {
        SimilarityHit cross_platform_arb = 3;
        SimilarityHit intra_platform_arb = 4;
    }
}

service EsuOdara {
  rpc Esu(stream Ebo) returns (stream Ebo);
}

