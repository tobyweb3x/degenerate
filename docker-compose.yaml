services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  go-backend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8090:8090" # Web UI to the world
      - "50051:50051" # gRPC port
    env_file:
      - ./web/.env
    environment:
      - BUILD=production
      - DOCKER_ENV=TRUE
    volumes:
      - ./kalshi.pem:/app/kalshi.pem:ro
    restart: unless-stopped

  rust-bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "sleep 3 && ./degenerate"
    environment:
      - QDRANT_URL=http://qdrant:6334 # Points to the Qdrant container
      - GRPC_URL=http://go-backend:50051 # Points to the Go container
    volumes:
      - ./kalshi.pem:/app/kalshi.pem:ro
      - ./privateKey.hex:/app/privateKey.hex:ro
    env_file:
      - .env
    depends_on:
      go-backend:
        condition: service_started
      qdrant:
        condition: service_started
    dns:
      - 8.8.8.8 # Google
      - 1.1.1.1 # Cloudflare
    restart: unless-stopped

volumes:
  qdrant_storage:
